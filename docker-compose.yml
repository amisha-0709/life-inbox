# Private-beta local composition. Does NOT publicly deploy or purchase infra.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lifeinbox
      POSTGRES_PASSWORD: lifeinbox
      POSTGRES_DB: lifeinbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      LIFE_INBOX_ENV: beta
      DATABASE_URL: postgresql+psycopg://lifeinbox:lifeinbox@db:5432/lifeinbox
      LIFE_INBOX_UPLOAD_DIR: /data/uploads
      # Supplied from your shell so no shared secret or credential is committed.
      LIFE_INBOX_SESSION_SECRET: ${LIFE_INBOX_SESSION_SECRET:?export a private secret of at least 32 characters}
      LIFE_INBOX_ALLOW_DEV_LOGIN: "0"
      LIFE_INBOX_AUTH_MODE: google
      LIFE_INBOX_PUBLIC_BASE_URL: ${LIFE_INBOX_PUBLIC_BASE_URL:-http://localhost:8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?export your Google OAuth client id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?export your Google OAuth client secret}
      LIFE_INBOX_TIMEZONE: UTC
    volumes:
      - uploads:/data/uploads
    depends_on:
      - db

volumes:
  pgdata:
  uploads:
