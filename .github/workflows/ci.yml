name: CI

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lifeinbox
          POSTGRES_PASSWORD: lifeinbox
          POSTGRES_DB: lifeinbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeinbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        env:
          OPENAI_API_KEY: ""
        run: python -m pytest -v --tb=short
      - name: Migrate empty database
        env:
          DATABASE_URL: sqlite:////tmp/life_inbox_ci.db
        run: python -m alembic upgrade head
      # Deployments use PostgreSQL; SQLite accepts SQL that PostgreSQL rejects.
      - name: Migrate empty PostgreSQL database
        env:
          DATABASE_URL: postgresql+psycopg://lifeinbox:lifeinbox@localhost:5432/lifeinbox
        run: python -m alembic upgrade head
