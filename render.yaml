# Class 8 public demo: Postgres + Google OAuth (no Dev Login).
# After first deploy, set LIFE_INBOX_PUBLIC_BASE_URL and GOOGLE_* to the
# public HTTPS origin, then add that callback URL in Google Cloud Console.
services:
  - type: web
    name: life-inbox-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LIFE_INBOX_ENV
        value: beta
      - key: LIFE_INBOX_AUTH_MODE
        value: google
      - key: LIFE_INBOX_ALLOW_DEV_LOGIN
        value: "0"
      - key: LIFE_INBOX_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: life-inbox-db
          property: connectionString
      - key: LIFE_INBOX_UPLOAD_DIR
        value: /data/uploads
      - key: LIFE_INBOX_PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini

databases:
  - name: life-inbox-db
    plan: free
